name: Decode PNGs
on:
  push:
    paths:
      - "*.png.b64"
      - ".github/workflows/decode-pngs.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit PNGs
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in *.png.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            file "$out"
            git add "$out"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Add decoded walkthrough PNGs"
          git push
