name: Decode PNGs
on:
  push:
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate chunks, decode, commit PNGs
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          for prefix in \
            fr-tenant-login-walkthrough \
            fr-tenant-schedule-walkthrough \
            fr-app-login-walkthrough \
            fr-app-dashboard-walkthrough \
            fr-app-clients-walkthrough \
            fr-app-settings-walkthrough
          do
            parts=(chunks/${prefix}.png.b64.*)
            if [ ${#parts[@]} -eq 0 ]; then
              echo "missing chunks for ${prefix}"
              exit 1
            fi
            cat "${parts[@]}" | base64 -d > "out/${prefix}.png"
            file "out/${prefix}.png"
            python3 -c "from pathlib import Path; p=Path('out/${prefix}.png'); assert p.read_bytes()[:8]==bytes.fromhex('89504e470d0a1a0a'), p"
            cp "out/${prefix}.png" "${prefix}.png"
            git add "${prefix}.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Add decoded walkthrough PNGs"
          git push
